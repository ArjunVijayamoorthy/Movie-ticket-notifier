name: BMS Ticket Checker

on:
  schedule:
    # Runs at the start of every hour
    - cron: '0 * * * *'
  
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Generate Dynamic Dates
        run: |
          # Automatically generates YYYYMMDD for Today, Tomorrow, and Day After in IST
          TODAY=$(TZ='Asia/Kolkata' date +%Y%m%d)
          TOMORROW=$(TZ='Asia/Kolkata' date -d "+1 day" +%Y%m%d)
          DAY_AFTER=$(TZ='Asia/Kolkata' date -d "+2 days" +%Y%m%d)
          echo "BMS_DATES=${TODAY},${TOMORROW},${DAY_AFTER}" >> $GITHUB_ENV

      - name: Run ticket check
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BMS_URL: ${{ vars.BMS_URL }}
          BMS_THEATRE: ${{ vars.BMS_THEATRE }}
          BMS_TIME: ${{ vars.BMS_TIME }}
        run: uv run main.py
